name: Comment Changesets PR Status

on:
  pull_request_target:

permissions: {} # recommended: reset permissions

# recommended: avoid concurrent runs for the same pr
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  pr-status:
    # recommended: skip the release pull request as it never has changesets
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    # You can also use the pull_request event if you prefer to lock permissions
    # down and not run for PRs from forks.
    # Make sure to add an if check to prevent the action from failing in fork PRs:
    # if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-slim
    permissions:
      contents: read # to check out repo (actions/checkout)
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate PR status
        id: pr-status
        uses: changesets/action/pr-status@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  pr-comment:
    needs: pr-status
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write # to create and update comments on PRs (changesets/action/pr-comment)
    steps:
      - name: Comment on PR
        uses: changesets/action/pr-comment@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
